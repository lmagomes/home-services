server:
    host: 0.0.0.0
    port: 8080
    proxied: true

theme:
    background-color: 240 8 9
    primary-color: 43 50 70

branding:
    app-name: Home Services
    hide-footer: false

pages:
    - name: Home
      width: wide
      columns:
          - size: small
            widgets:
                - type: server-stats
                  servers:
                      - type: local
                        name: Server

                - type: docker-containers
                  title: Containers
                  hide-by-default: false

          - size: full
            widgets:
                - type: group
                  widgets:
                      - type: monitor
                        title: Services
                        cache: 1m
                        sites:
                            - title: opencode
                              url: https://opencode.${DOMAIN}
                              icon: di:opencode
                            - title: Forgejo
                              url: https://forgejo.${DOMAIN}
                              icon: di:forgejo
                            - title: Cockpit
                              url: https://mila.${DOMAIN}
                              icon: sh:cockpit
                            - title: Authentik
                              url: https://authentik.${DOMAIN}
                              icon: sh:authentik
                            - title: Termix
                              url: https://termix.${DOMAIN}
                              icon: sh:termix
                            - title: Jotty
                              url: https://jotty.${DOMAIN}
                              icon: di:jotty
                            - title: Draw.io
                              url: https://drawio.${DOMAIN}
                              icon: di:draw-io
                            - title: Karakeep
                              url: https://karakeep.${DOMAIN}
                              icon: sh:karakeep
                            - title: Jellyfin
                              url: https://jellyfin.${DOMAIN}
                              icon: di:jellyfin
                            - title: Audiobookshelf
                              url: https://audiobookshelf.${DOMAIN}
                              icon: di:audiobookshelf
                            - title: Calibre
                              url: https://calibre.${DOMAIN}
                              icon: sh:calibre-web
                            - title: Immich
                              url: https://immich.${DOMAIN}
                              icon: di:immich
                            - title: Transmission
                              url: https://transmission.${DOMAIN}
                              icon: di:transmission
                            - title: Dozzle
                              url: https://dozzle.${DOMAIN}
                              icon: di:dozzle
                            - title: Uptime Kuma
                              url: https://uptime-kuma.${DOMAIN}
                              icon: sh:uptime-kuma
                            - title: Miniflux
                              url: https://miniflux.${DOMAIN}
                              icon: sh:miniflux
                            - title: Mealie
                              url: https://mealie.${DOMAIN}
                              icon: di:mealie
                            - title: Paperless
                              url: https://paperless.${DOMAIN}
                              icon: sh:paperless-ngx
                            - title: Paperless AI
                              url: https://paperless-ai.${DOMAIN}
                              icon: di:paperless-ngx
                            - title: Paperless GPT
                              url: https://paperless-gpt.${DOMAIN}
                              icon: di:paperless-gpt
                            - title: Dawarich
                              url: https://dawarich.${DOMAIN}
                              icon: di:dawarich
                            - title: Firefly
                              url: https://firefly.${DOMAIN}
                              icon: di:firefly-iii
                            - title: Firefly Data Importer
                              url: https://firefly-data-importer.${DOMAIN}
                              icon: di:firefly-iii
                            - title: Bichon
                              url: https://bichon.${DOMAIN}
                              icon: sh:mail-archiver
                            - title: Open WebUI
                              url: https://open-webui.${DOMAIN}
                              icon: di:open-webui
                            - title: Portabase
                              url: https://portabase.${DOMAIN}
                              icon: sh:portabase

                      - type: releases
                        title: Upstream Releases
                        cache: 1d
                        show-source-icon: true
                        token: ${GITHUB_TOKEN}
                        repositories:
                            - immich-app/immich
                            - paperless-ngx/paperless-ngx
                            - glanceapp/glance
                            - go-gitea/gitea
                            - jellyfin/jellyfin
                            - louislam/uptime-kuma
                            - miniflux/v2
                            - mealie-recipes/mealie
                            - advplyr/audiobookshelf
                            - goauthentik/authentik
                            - Freika/dawarich
                            - firefly-iii/firefly-iii
                            - firefly-iii/data-importer
                            - karakeep-app/karakeep
                            - crocodilestick/calibre-web-automated
                            - amir20/dozzle
                            - open-webui/open-webui
                            - clusterzx/paperless-ai
                            - icereed/paperless-gpt
                            - jgraph/drawio
                            - CorentinTh/it-tools
                            - lukegus/termix
                            - rustmailer/bichon
                            - fccview/jotty
                            - mudler/LocalAI
                            - ggml-org/llama.cpp
                            - ZeroTricks/lumo-tamer

          - size: small
            widgets:
                - type: custom-api
                  title: Open Updates
                  cache: 5m
                  url: https://forgejo.${DOMAIN}/api/v1/repos/lgomes/home-services/pulls?state=open&labels=renovate
                  headers:
                      Authorization: Bearer ${FORGEJO_TOKEN}
                  template: |
                      {{ $pulls := .JSON.Array "." }}
                      {{ if eq (len $pulls) 0 }}
                        <p class="size-h4 color-positive">No open Renovate PRs</p>
                      {{ else }}
                        <ul class="list list-gap-10">
                        {{ range $pulls }}
                          <li class="text-truncate">
                            <a class="size-h4 color-highlight" href="https://forgejo.${DOMAIN}/{{ .String "head.repo.full_name" }}/pulls/{{ .Int "number" }}">
                              {{ .String "title" }}
                            </a>
                          </li>
                        {{ end }}
                        </ul>
                      {{ end }}

                - type: bookmarks
                  title: Services
                  groups:
                      - title: Development
                        color: 30 60 50
                        links:
                            - title: opencode
                              url: https://opencode.${DOMAIN}
                              icon: di:opencode
                            - title: Forgejo
                              url: https://forgejo.${DOMAIN}
                              icon: di:forgejo

                      - title: Server
                        color: 40 100 80
                        links:
                            - title: Cockpit
                              url: https://mila.${DOMAIN}
                              icon: sh:cockpit
                            - title: Authentik
                              url: https://authentik.${DOMAIN}
                              icon: sh:authentik
                            - title: Termix
                              url: https://termix.${DOMAIN}
                              icon: sh:termix
                            - title: Portabase
                              url: https://portabase.${DOMAIN}
                              icon: sh:portabase

                      - title: Notes
                        color: 240 40 45
                        links:
                            - title: Jotty
                              url: https://jotty.${DOMAIN}
                              icon: di:jotty
                            - title: Draw.io
                              url: https://drawio.${DOMAIN}
                              icon: di:draw-io
                            - title: Karakeep
                              url: https://karakeep.${DOMAIN}
                              icon: sh:karakeep

                      - title: Media
                        color: 340 60 50
                        links:
                            - title: Jellyfin
                              url: https://jellyfin.${DOMAIN}
                              icon: di:jellyfin
                            - title: Audiobookshelf
                              url: https://audiobookshelf.${DOMAIN}
                              icon: di:audiobookshelf
                            - title: Calibre
                              url: https://calibre.${DOMAIN}
                              icon: sh:calibre-web
                            - title: Immich
                              url: https://immich.${DOMAIN}
                              icon: di:immich
                            - title: Transmission
                              url: https://transmission.${DOMAIN}
                              icon: di:transmission

                      - title: Monitoring
                        color: 120 40 45
                        links:
                            - title: Dozzle
                              url: https://dozzle.${DOMAIN}
                              icon: di:dozzle
                            - title: Uptime Kuma
                              url: https://uptime-kuma.${DOMAIN}
                              icon: sh:uptime-kuma

                      - title: Services
                        color: 200 50 50
                        links:
                            - title: Miniflux
                              url: https://miniflux.${DOMAIN}
                              icon: sh:miniflux
                            - title: Mealie
                              url: https://mealie.${DOMAIN}
                              icon: di:mealie
                            - title: Paperless
                              url: https://paperless.${DOMAIN}
                              icon: sh:paperless-ngx
                            - title: Dawarich
                              url: https://dawarich.${DOMAIN}
                              icon: di:dawarich
                            - title: Firefly
                              url: https://firefly.${DOMAIN}
                              icon: di:firefly-iii
                            - title: Bichon
                              url: https://bichon.${DOMAIN}
                              icon: sh:mail-archiver

                      - title: LLM
                        color: 320 80 60
                        links:
                            - title: Open WebUi
                              url: https://open-webui.${DOMAIN}
                              icon: di:open-webui
                            - title: llama-cpp
                              url: https://llamacpp.${DOMAIN}
                              icon: sh:llama-cpp
                            - title: openai
                              url: https://openai.${DOMAIN}
                              icon: di:openai

                - type: rss
                  title: selfh.st
                  cache: 1h
                  limit: 10
                  collapse-after: 5
                  feeds:
                      - url: https://selfh.st/rss/

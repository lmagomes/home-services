
settings:
  log:
    level: INFO       # Log level, DEBUG/VERBOSE/INFO/WARNING/ERROR
    timestamps: false # Log with timestamps
  data:
    database_file: data/argus.db # SQLite DB file used to track the state of services
  web:
    listen_host: 0.0.0.0  # IP address to listen on
    listen_port: 9090     # Port to listen on
    route_prefix: /       # Web route prefix, e.g. /demo means http://IP:PORT/demo to access
    disabled_routes: []   # API Routes to disable (see below)

defaults:
  service:
    options:
      interval: 12h              # How often to query for new releases

webhook:
  update-pr:
    type: github
    url: http://service-hub:8081/webhook
    secret: ${UPDATE_WEBHOOK_SECRET}
    desired_status_code: 200
    max_tries: 3
    delay: 10s
    headers:
      - key: X-Version
        value: '{{ version }}'

service:

  monitor/argus:
    latest_version:
      type: github
      url: release-argus/argus
      access_token: ${GITHUB_ACCESS_TOKEN}
    deployed_version:
      url: http://service-hub:8081/version/argus
      json: version
    webhook:
      update-pr:
        headers:
          - key: X-Service
            value: 'monitor/argus'
          - key: X-Version
            value: '{{ version }}'
    dashboard:
      auto_approve: true
      web_url: https://github.com/release-argus/Argus/blob/master/CHANGELOG.md
      icon: https://github.com/release-argus/Argus/raw/master/web/ui/react-app/public/favicon.svg
      icon_link_to: https://argus.${BASE_DOMAIN_NAME}/

  monitor/dozzle:
    latest_version:
      type: github
      url: amir20/dozzle
      url_commands:
        - type: regex
          regex: v([0-9.]+)$
      access_token: ${GITHUB_ACCESS_TOKEN}
    deployed_version:
      url: http://service-hub:8081/version/dozzle
      json: version
      regex: ^v([0-9.]+)$
    webhook:
      update-pr:
        headers:
          - key: X-Service

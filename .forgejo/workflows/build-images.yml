name: Build Images and Update Podman

on:
  push:
    branches: [main]
    paths:
      - 'builds/**'
      - 'quadlets/**'
      - 'timers/**'

jobs:
  build:
    runs-on: host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Login to Forgejo Container Registry
        run: just registry-login-ci
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push changed images
        run: just build-and-push-changed

  update-podman:
    needs: [build]
    runs-on: host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync quadlets and update images
        run: |
          just sync-secrets
          just install-quadlets
          just update-podman-images

      - name: Install timers
        run: just install-timers

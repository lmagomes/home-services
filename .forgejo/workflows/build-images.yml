name: Build Images and Update Podman

on:
  push:
    branches: [main]
    paths:
      - 'builds/**'
      - 'quadlets/**'
      - 'timers/**'

concurrency:
  group: deploy-${{ forgejo.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Forgejo Container Registry
        run: just registry-login-ci
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push changed images
        env:
          BEFORE_SHA: ${{ forgejo.event.before }}
        run: just build-and-push-changed "$BEFORE_SHA"

  update-podman:
    needs: [build]
    runs-on: host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync quadlets and update images
        env:
          BEFORE_SHA: ${{ forgejo.event.before }}
        run: |
          just sync-secrets
          just install-quadlets
          just update-podman-images-since "$BEFORE_SHA"

      - name: Install timers
        run: just install-timers

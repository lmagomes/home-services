name: Prune Registry Images

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  prune:
    runs-on: host
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prune old image versions
        run: just prune-registry-images

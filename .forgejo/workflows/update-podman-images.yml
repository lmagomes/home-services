name: Update Podman Images

on:
  pull_request:
    types: [closed]

jobs:
  update:
    if: forgejo.event.pull_request.merged == true && startsWith(forgejo.event.pull_request.head.ref, 'updates/')
    runs-on: host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Sync quadlets and update images
        run: |
          just sync-secrets
          just install-quadlets
          just update-podman-images
